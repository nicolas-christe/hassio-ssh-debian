# Local overrides for this add-on. Debian's default /etc/ssh/sshd_config
# has `Include /etc/ssh/sshd_config.d/*.conf` near the top — for most
# OpenSSH directives the FIRST value wins, so this file's settings take
# effect before the rest of the base sshd_config is even read.

LogLevel INFO

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

AllowTcpForwarding no
GatewayPorts no
X11Forwarding no

Banner none
PrintMotd no
